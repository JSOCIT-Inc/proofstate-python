name: Publish Python prerelease

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.2"
          python-version: "3.13"
      - name: Validate tag, version, and release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          COMPAT_VERIFIED_TAG: ${{ vars.PROOFSTATE_RELEASE_COMPAT_VERIFIED_TAG }}
        run: |
          test "$RELEASE_TAG" = "$COMPAT_VERIFIED_TAG"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          uv run --frozen python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version

          with open("pyproject.toml", "rb") as project_file:
              project = tomllib.load(project_file)
          assert project["project"]["name"] == "proofstate"
          version = project["project"]["version"]
          assert Version(version).is_prerelease and not Version(version).is_devrelease
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          PY
      - name: Install and run unit checks
        run: |
          uv sync --locked
          uv run --frozen ruff check .
          uv run --frozen pytest tests/unit
      - name: Build source archive and wheel
        run: uv build --no-sources
      - name: Validate clean wheel and source archive installations
        run: |
          uv venv "$RUNNER_TEMP/proofstate-wheel-check" --python 3.13
          uv pip install --python "$RUNNER_TEMP/proofstate-wheel-check/bin/python" dist/*.whl
          uv venv "$RUNNER_TEMP/proofstate-sdist-check" --python 3.13
          uv pip install --python "$RUNNER_TEMP/proofstate-sdist-check/bin/python" dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/proofstate-wheel-check/bin/python" - <<'PY'
          from importlib.metadata import version
          import proofstate
          import proofstate.api

          assert version("proofstate") == proofstate.__version__
          PY
          "$RUNNER_TEMP/proofstate-sdist-check/bin/python" - <<'PY'
          from importlib.metadata import version
          import proofstate
          import proofstate.api

          assert version("proofstate") == proofstate.__version__
          PY
      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
